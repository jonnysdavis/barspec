<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barspec</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Barspec</h1>
        <p>Gamepad camera control for Beyond All Reason.</p>
      </header>

      <section class="main-layout">
        <div class="left-panel">
          <section class="panel status-panel">
            <div class="status-row">
              <span class="label">Status</span>
              <strong data-status>Idle</strong>
            </div>
            <div class="status-row">
              <span class="label">Gamepad</span>
              <strong data-pad>No gamepad detected</strong>
              <small style="font-size: 10px; opacity: 0.7;">Press any button to connect</small>
            </div>
            <button class="primary" data-active>Start camera control</button>
          </section>

          <section class="panel controller-section">
            <div class="controller-container">
              <!-- Visual representation of the controller -->
              <div class="gamepad-visual">
                <div class="node l2" data-button="6" title="L2"><span data-label="6"></span></div>
                <div class="node r2" data-button="7" title="R2"><span data-label="7"></span></div>
                <div class="node l1" data-button="4" title="L1"><span data-label="4"></span></div>
                <div class="node r1" data-button="5" title="R1"><span data-label="5"></span></div>

                <div class="node ls" data-stick="ls" title="Left Stick"><div class="dot"></div><span data-label="ls"></span></div>
                <div class="node rs" data-stick="rs" title="Right Stick"><div class="dot"></div><span data-label="rs"></span></div>

                <div class="node dpad" title="D-Pad">
                  <div class="d-btn up" data-button="12"></div>
                  <div class="d-btn down" data-button="13"></div>
                  <div class="d-btn left" data-button="14"></div>
                  <div class="d-btn right" data-button="15"></div>
                  <span data-label="dpad">Arrows</span>
                </div>

                <div class="node abxy" title="Buttons">
                  <div class="v-btn y" data-button="3" title="Y"><span data-label="3"></span></div>
                  <div class="v-btn x" data-button="2" title="X"><span data-label="2"></span></div>
                  <div class="v-btn b" data-button="1" title="B"><span data-label="1"></span></div>
                  <div class="v-btn a" data-button="0" title="A"><span data-label="0"></span></div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div class="right-panel">
          <section class="panel settings-panel">
            <h2>Settings</h2>
            <label class="slider">
              <span>Sensitivity</span>
              <input data-sensitivity type="range" min="0.1" max="3.0" step="0.05" value="1.0" />
              <span class="value" data-sensitivity-value>1.00</span>
            </label>
            <label class="slider">
              <span>Deadzone</span>
              <input data-deadzone type="range" min="0.01" max="0.5" step="0.01" value="0.15" />
              <span class="value" data-deadzone-value>0.15</span>
            </label>
          </section>

          <section class="panel config-panel">
            <h2>Button Mappings</h2>
            <div class="config-list" data-config-list>
              <!-- Populated by JS -->
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
